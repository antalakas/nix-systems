# Reference mounts for the Claude Code sandbox.
#
# Each line: <host-path>:<container-path>[:ro|:rw]
# Lines starting with # are ignored. Read-only unless the line ends in :rw.
#
# The host path is relative to $CLAUDE_REFS_ROOT, which is why this file is the
# same on every machine — only the root differs, and each host sets its own:
#
#   forge   $HOME/workspace                          (the default)
#   laptop  /mnt/endeavouros/home/andreas/workspace  (hosts/nixos/home.nix)
#
# An absolute host path is still honoured, for a repo that lives outside the
# root. Prefer a relative one: an absolute path is the thing that made this file
# machine-specific in the first place.
#
# A path that does not exist on this host is skipped with a warning, so an entry
# for a repo you have not cloned here is harmless — it will not silently become
# an empty directory inside the container.
#
# Keep every entry a specific project directory. Mounting $HOME, ~/.config, or
# ~/.config/claude-code would expose ~/.config/claude-code/github-tokens to the
# container, which defeats claude-sandbox's per-owner GitHub token selection:
# a sandbox would then see every owner's PAT, not just its workspace's.
#
# A :rw entry is the host's directory, edited in place by whatever the agent
# does. Keep it to a directory meant to be written by an agent, never a whole
# repository: the read-only default is what lets a session read every
# reference without being able to change one. The banner's Refs: line names
# the writable ones.

tiledb/repos/TileDB-Server:/ref/TileDB-Server
tiledb/repos/infrastructure:/ref/infrastructure
tiledb/repos/TileDB-Helm:/ref/TileDB-Helm
tiledb/repos/TileDB-Cloud-UI:/ref/TileDB-Cloud-UI
tiledb/repos/TileDB-Client-Py:/ref/TileDB-Client-Py
tiledb/repos/tile-ai-poc:/ref/tile-ai-poc
tiledb/repos/slab-classic:/ref/slab
tiledb/repos/TileDB-Cloud-JupyterHub:/ref/TileDB-Cloud-JupyterHub
tiledb/repos/TileDB-Cloud-REST:/ref/TileDB-Cloud-REST
tiledb/repos/deploy-tileai:/ref/deploy-tileai
tiledb/repos/tile-ai:/ref/tile-ai
tiledb/repos/tile-ai-vcf:/ref/tile-ai-vcf
tiledb/repos/TileDB-REST-UDF-Docker-Images:/ref/TileDB-REST-UDF-Docker-Images
tiledb/repos/nfs4serve:/ref/nfs4serve
tiledb/repos/carrara-uat:/ref/uat
tiledb/repos/Product-Design:/ref/Product-Design
andreas/tessera:/ref/tessera

# Writable: tile-ai's research/ — the journal, the-list and the convergence
# archive — at /notes. The journal rule is one entry per task, and a session
# opened on any other repository could only read it, at /ref/tile-ai/research,
# so the entry was written a session later (journal 2026-09-21, again
# 2026-09-29). From /notes it is written when the task is.
tiledb/repos/tile-ai/research:/notes:rw

