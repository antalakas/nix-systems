# sops rules. Encrypted files under secrets/ are committed to this repo; the
# keys that can decrypt them are listed here.
#
# A host's age key is derived from its SSH host key, which exists only after
# the machine is installed. To add a new host, run on it:
#
#   ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub
#
# (ssh-to-age is in home/common.nix, so it is on PATH from the first boot —
# deliberately not a `nix run nixpkgs#`, which needs the flake registry at
# exactly the moments an install is least able to tolerate a failed fetch.)
#
# Every file is encrypted to two keys, and the second one is not redundancy for
# convenience — it is the only recovery path. A host key dies with the host: a
# reinstall generates a new SSH host key, so anything encrypted solely to the
# old one is unreadable by everyone, permanently. The personal key is what
# survives that, which is why it is generated on the laptop
# (`age-keygen -o ~/.config/sops/age/keys.txt`) and must be backed up somewhere
# off that machine. There is no other copy and no way to recover from losing it.

keys:
  # forge — derived from its SSH host key, regenerated by any reinstall
  - &forge age1ry7m4wzrzss0fqwguh8zgdalvnmrqhfvrevh0vsuzq29vxycyfmswp3t50
  # andreas — personal key, lives on the laptop, outlives any single host
  - &andreas age1k42m4k7jjzc6g94vdx44w68ccuhs9769n99xnye83g3t8833geksg4edne

creation_rules:
  - path_regex: secrets/forge\.yaml$
    key_groups:
      - age:
          - *forge
          - *andreas
