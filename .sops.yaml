# sops rules. Encrypted files under secrets/ are committed to this repo; the
# keys that can decrypt them are listed here.
#
# A host's age key is derived from its SSH host key, which exists only after
# the machine is installed. To fill in the placeholder below, run on the host:
#
#   nix run nixpkgs#ssh-to-age -- -i /etc/ssh/ssh_host_ed25519_key.pub
#
# Then, so you can still read and edit the file from the laptop, add your
# personal age key alongside it (`age-keygen -o ~/.config/sops/age/keys.txt`).

keys:
  - &forge age1REPLACE_ME_WITH_FORGE_HOST_KEY
  - &andreas age1REPLACE_ME_WITH_YOUR_PERSONAL_KEY

creation_rules:
  - path_regex: secrets/forge\.yaml$
    key_groups:
      - age:
          - *forge
          - *andreas
